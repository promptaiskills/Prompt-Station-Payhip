# ---------------------------------------------------------------------------
# Netlify configuration — Prompt Station storefront
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Serverless functions (auto-discovered in /netlify/functions)
# ---------------------------------------------------------------------------
[functions]
  # Keep bundles small; plain .mjs functions need no bundling
  node_bundler = "nft"

# ---------------------------------------------------------------------------
# Security headers (active)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived cache for hashed build assets (/_astro/*)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# OPTIONAL — Content-Security-Policy
# Commented out by default. Buy buttons open Payhip's hosted checkout in a
# new tab (no third-party scripts are loaded into this site), so a strict CSP
# is safe here — enable and adapt once you are happy with the setup.
# ---------------------------------------------------------------------------
# [[headers]]
#   for = "/*"
#   [headers.values]
#     Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.netlify.app; object-src 'none'; base-uri 'self'; form-action 'self' https://*.netlify.app; frame-ancestors 'self'"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# No custom redirects are required for this static site.
# Netlify serves public/404.html automatically for unmatched routes.